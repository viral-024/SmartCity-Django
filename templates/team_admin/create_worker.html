{% extends 'team_admin/base_team_admin.html' %}

{% block title %}Create Worker - SmartCity EMS{% endblock %}

{% block team_admin_content %}
<div class="row justify-content-center">
    <div class="col-lg-6 mb-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <i class="fas fa-user-plus me-2"></i>Create New Worker Account
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Username *</label>
                        <input type="text" name="username" class="form-control" 
                               placeholder="e.g., worker_john" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password *</label>
                        <input type="password" name="password" class="form-control" 
                               placeholder="Minimum 8 characters" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" name="phone_number" class="form-control" 
                               placeholder="e.g., 9876543210" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" 
                               placeholder="worker@example.com">
                    </div>
                    
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        <strong>Note:</strong> Workers cannot log in directly. They are assigned to teams by Team Administrators.
                    </div>
                    
                    <div class="d-flex gap-2">
                        <a href="{% url 'team_admin:manage_workers' %}" class="btn btn-secondary w-100">
                            <i class="fas fa-arrow-left me-1"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-user-plus me-1"></i>Create Worker
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
